name: 'Lint Code'
description: 'Run all linters (Python, Markdown, YAML)'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Python linting dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run flake8
      shell: bash
      run: |
        flake8 src/mouse_keepalive/ --max-line-length=120 --extend-ignore=E203,W503

    - name: Run black (check)
      shell: bash
      run: |
        black --check --line-length=120 src/mouse_keepalive/

    - name: Run pylint
      shell: bash
      run: |
        pylint src/mouse_keepalive/ --max-line-length=120 --disable=C0111 || true

    - name: Run mypy (type checking)
      shell: bash
      run: |
        mypy src/mouse_keepalive/ --ignore-missing-imports || true

    - name: Install ShellCheck
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Run ShellCheck (local dev script)
      shell: bash
      run: |
        shellcheck move_mouse.sh

    - name: Install markdownlint-cli
      shell: bash
      run: |
        npm install -g markdownlint-cli

    - name: Run markdownlint
      shell: bash
      run: |
        markdownlint "*.md" "docs/*.md" --config .markdownlint.json || true

    - name: Run yamllint
      shell: bash
      run: |
        yamllint -c .yamllint.yml .github/workflows/*.yml || true
